<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span class="brand-name">AppPanel</span>
    </div>

    <h2>Bienvenido</h2>
    <p class="subtitle">Ingresa tus credenciales para continuar</p>

    <div id="loginError" class="login-error" role="alert"></div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username"
               placeholder="tu_usuario" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:0.5rem">
        <span id="btnText">Iniciar sesión</span>
        <span id="btnSpinner" class="spinner" style="display:none"></span>
      </button>
    </form>
  </div>

  <!-- ── PRESENTATION OVERLAY ── -->
  <div id="presentationOverlay" class="presentation-overlay">
    <div class="presentation-card">
      <button class="presentation-close" id="presentationClose" aria-label="Cerrar">✕</button>

      <div class="presentation-logo">
        <div class="presentation-logo-icon">⚡</div>
      </div>

      <span class="presentation-title">AppPanel</span>
      <span class="presentation-subtitle">Tu panel de control para gestionar tareas y proyectos</span>

      <div class="presentation-divider"></div>

      <span class="presentation-text">Puedes probar con estos usuarios de demo:</span>

      <div class="presentation-users">
        <div class="presentation-user-chip">
          <div class="pu-avatar pu-admin">A</div>
          <div class="pu-info">
            <span class="pu-username">admin</span>
            <span class="pu-pass">@dm1n</span>
          </div>
          <span class="badge badge-admin">Admin</span>
        </div>
        <div class="presentation-user-chip">
          <div class="pu-avatar pu-user">U</div>
          <div class="pu-info">
            <span class="pu-username">user</span>
            <span class="pu-pass">Us3r</span>
          </div>
          <span class="badge badge-user">User</span>
        </div>
      </div>

      <a class="presentation-github" href="https://github.com/Tanatosby/demoempresa" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        Ver en GitHub
      </a>

      <button class="btn btn-primary presentation-btn-enter" id="presentationEnter">
        Entrar al sistema →
      </button>

      <label class="presentation-remember">
        <input type="checkbox" id="presentationDontShow">
        <span>No mostrar de nuevo</span>
      </label>
    </div>
  </div>

  <script>
    // ── Presentation overlay logic (vanilla, no module needed) ──
    (function () {
      const STORAGE_KEY = "appanel_intro_seen"
      const overlay     = document.getElementById("presentationOverlay")
      const btnClose    = document.getElementById("presentationClose")
      const btnEnter    = document.getElementById("presentationEnter")
      const chkDontShow = document.getElementById("presentationDontShow")

      // If user already dismissed it permanently, hide immediately
      if (localStorage.getItem(STORAGE_KEY) === "1") {
        overlay.classList.add("presentation-hidden")
        return
      }

      // Show with animation
      overlay.classList.add("presentation-visible")

      function dismiss() {
        if (chkDontShow.checked) {
          localStorage.setItem(STORAGE_KEY, "1")
        }
        overlay.classList.add("presentation-closing")
        overlay.addEventListener("animationend", () => {
          overlay.classList.add("presentation-hidden")
        }, { once: true })
      }

      btnClose.addEventListener("click", dismiss)
      btnEnter.addEventListener("click", dismiss)

      // Click outside card also closes
      overlay.addEventListener("click", e => {
        if (e.target === overlay) dismiss()
      })
    })()
  </script>

  <script type="module" src="scripts.js"></script>
</body>
</html>
